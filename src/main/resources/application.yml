logging:
  level.com.yellowsquash.crm: DEBUG

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
  compression:
    enabled: true
    min-response-size: 2048

spring:
  mvc:
    async:
      request-timeout: 180000 # 3 minutes for long-running analyser requests
    pathmatch:
      matching-strategy: ant_path_matcher
  cassandra:
    contact-points:
      - localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: realtime_stock_data
    schema-action: create-if-not-exists
    connection:
      connect-timeout: 5000ms # Set the connect timeout to 5000 milliseconds
      init-query-timeout: 10000ms # Set the initial query timeout
    request:
      timeout: 10000ms # Set the request timeout to 10000 milliseconds
    pool:
      idle-timeout: 10000ms  # Set the idle timeout for connections in the pool
      heartbeat-interval: 30000ms # Interval to check connections in the pool
#      request:
#        timeout: 10000ms
#      connection:
#        connect-timeout: 5000ms
#        init-query-timeout: 5000ms

#springdoc:
#  swagger-ui:
#    doc-expansion: none

# OpenAI API configuration
# api-key is the file path containing the actual API key text
openai:
  api-key: /Users/y0p03mn/Desktop/OPEN_API_KEY.txt
  model-name: gpt-5
  service-tier: priority
  # Token limits — tune here without changing code
  # Reasoning models (gpt-5, o1, o3, o4) consume hidden "thinking" tokens
  # before generating visible output. Set max-tokens-reasoning high enough
  # to cover both internal reasoning (~1500-2500 tokens) + actual output (~400 tokens).
  max-tokens-reasoning: 4000
  # Classic chat-completion models (gpt-4o, gpt-4-turbo) only produce visible tokens.
  max-tokens-classic: 600
  # When web search is enabled, more tokens are needed: search calls + reading results + output.
  max-tokens-with-search: 6000
  # Enable GPT web search to fetch live fundamentals, earnings, analyst ratings and news.
  # true  = GPT searches the web before analysing (adds ~5-15s, richer commentary)
  # false = technical-only analysis, faster response
  web-search-enabled: true
  # Include only the most recent OHLCV rows in prompt for candlestick/volume context.
  # 30 rows is a good balance (~450 tokens) vs 1Y data (~3,700+ tokens).
  prompt-ohlcv-max-rows: 30

springfox:
  documentation:
    swagger:
      v2:
        path: /api-docs

stock:
  analyser:
    # ── lookbackDays reference (pass in the POST /analyse request body) ──────
    #
    # lookbackDays controls how much historical data is fetched AND which
    # period analyses are generated and stored in Cassandra:
    #
    #   lookbackDays = 252  →  generates: 1Y + 6M           (2 rows in Cassandra)
    #   lookbackDays = 504  →  generates: 2Y + 1Y + 6M      (3 rows in Cassandra)
    #   lookbackDays = 756  →  generates: 3Y + 2Y + 1Y + 6M (4 rows in Cassandra) ← DEFAULT
    #
    # Period thresholds (trading days):
    #   6M = 126 trading days  (~6 calendar months)
    #   1Y = 252 trading days  (~1 calendar year)
    #   2Y = 504 trading days  (~2 calendar years)
    #   3Y = 756 trading days  (~3 calendar years)
    #
    # Example request:
    #   POST /stock/investment/v1.0/stockAnalyser/analyse
    #   { "symbol": "INFY", "lookbackDays": 756, "includeAiCommentary": true }
    #
    # ── chunk-coverage-threshold ──────────────────────────────────────────────
    # % weekday coverage needed to treat a chunk as already present in DB.
    # Tuning guide:
    #   90 -> stricter (fetch more often; only near-complete DB chunks are skipped)
    #   75 -> balanced (recommended default)
    #   60 -> lenient (fewer NSE calls; more DB chunks considered good enough)
    # Example: if a 3-month chunk has 60 weekdays and DB has 50 rows:
    #   coverage = 83.3%; skipped at 75/60, fetched at 90.
    chunk-coverage-threshold: 75
